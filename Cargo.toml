[workspace]
resolver = "2"
members = [
    "crates/sa-ir",
    "crates/sa-lexer",
    "crates/sa-parser",
    "crates/sa-flatten",
    "crates/sa-verify",
    "crates/sa-emit-js",
    "crates/sa-emit-wasm",
    "crates/sa-emit-c",
    "crates/sa-interp",
    "crates/sa-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/layola13/sars"

[profile.release]
opt-level = 2
lto = true
strip = true
